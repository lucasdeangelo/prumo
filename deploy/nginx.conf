# In front of the Prumo app. Receives LAN requests (port 80 of the container) and the traffic of
# the Cloudflare Tunnel. TLS ends at Cloudflare; the tunnel to here is already encrypted.

# Real visitor IP when the request came through Cloudflare.
map $http_cf_connecting_ip $visitor_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

# Cloudflare tells the original scheme; LAN requests are plain http.
map $http_x_forwarded_proto $forwarded_proto {
  ""      $scheme;
  default $http_x_forwarded_proto;
}

upstream prumo_app {
  server app:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 2m;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Built assets have hashed names: cache them for a long time.
  location /_next/static/ {
    proxy_pass http://prumo_app;
    proxy_set_header Host $http_host;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Android app (APK built from mobile/, copied into deploy/download/). Never cached, so a new
  # build is picked up right away.
  location /download/ {
    alias /srv/download/;
    types { application/vnd.android.package-archive apk; }
    default_type application/octet-stream;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    proxy_pass http://prumo_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Server actions compare Origin with the forwarded host: keep the host the browser used.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $visitor_ip;
    proxy_set_header X-Real-IP $visitor_ip;
    proxy_read_timeout 120s;
  }
}
